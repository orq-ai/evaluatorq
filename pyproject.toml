[build-system]
requires = [ "hatchling", "hatch-vcs" ]
build-backend = "hatchling.build"

# Version is derived from the latest git tag (vX.Y.Z) — nothing is committed back
# to main on release, so the release pipeline only pushes a tag (which the
# Protect-main branch ruleset does not govern). No version bump commit, no deploy
# key, no ruleset bypass.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [ "src/evaluatorq" ]
include = [ "src/evaluatorq/py.typed", "src/evaluatorq/**/*.json", "src/evaluatorq/**/*.css", "src/evaluatorq/**/*.js", "src/evaluatorq/**/*.woff2", "src/evaluatorq/**/*.svg" ]

[tool.hatch.build.targets.sdist]
exclude = [ "examples/", ".venv/", "tests/" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
python_files = [ "test_*.py", "*_test.py" ]
norecursedirs = [ ".venv", "dist", "*.egg-info" ]
markers = [
  "integration: marks tests as integration tests (require ORQ_API_KEY in .env)",
  "allow_network: test may open real outbound connections (exempt from the conftest network guard)"
]
timeout = 120

[tool.coverage.run]
source = [ "src/evaluatorq" ]
# relative_files is required by python-coverage-comment-action — the CI job runs
# coverage in a different absolute path than the action reads it back from.
relative_files = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 120
preview = true
src = [ "src" ]

  [tool.ruff.format]
  quote-style = "single"

  [tool.ruff.lint]
  select = [
  "E",
  "F",
  "W",
  "FAST",
  "ANN",
  "ASYNC",
  "S",
  "FBT",
  "B",
  "A",
  "DTZ",
  "INT",
  "ISC",
  "LOG",
  "ICN",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "TC",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "C90",
  "NPY",
  "PD",
  "N",
  "PERF",
  "DOC",
  "UP",
  "FURB",
  "RUF",
  "TRY",
  "BLE001"
]
  ignore = [
  "G001",
  "G002",
  "Q000",
  "Q003",
  "TRY003",
  "G004",
  "TRY002",
  "ANN401",
  "N815",
  "B904",
  "PYI063",
  "PT011",
  "B017",
  "N806",
  "ANN001",
  "ANN201",
  "ANN202",
  "ANN204",
  "C901",
  "TRY301",
  "TRY401",
  "T201",
  "G201",
  "TRY300",
  "E402",
  "ARG002",
  "F841",
  "SIM102",
  "S603",
  "S607",
  "S404",
  "ASYNC230",
  "PTH123",
  "DOC201",
  "DOC501",
  "DOC502",
  "ARG001",
  "E501",
  "S311",
  "RUF027"
]

    # BLE001 debt register: blind `except Exception` swallowing real errors is a
    # documented silent-failure source (PR #96 — a TypeError made every evaluation
    # return passed=None). The rule is on repo-wide; these files predate it. Shrink
    # this list, never grow it. Tracked for burn-down in RES-1298.
    [tool.ruff.lint.per-file-ignores]
    "src/evaluatorq/common/apply.py" = ["BLE001"]
    "src/evaluatorq/common/async_utils.py" = ["BLE001"]
    "src/evaluatorq/common/judge.py" = ["BLE001"]
    "src/evaluatorq/common/output_adapters.py" = ["BLE001"]
    "src/evaluatorq/common/reports/executive_summary.py" = ["BLE001"]
    "src/evaluatorq/common/reports/vega.py" = ["BLE001"]
    "src/evaluatorq/common/target_call.py" = ["BLE001"]
    "src/evaluatorq/common/tracing.py" = ["BLE001"]
    "src/evaluatorq/dashboard/app.py" = ["BLE001"]
    "src/evaluatorq/dashboard/apply_ui.py" = ["BLE001"]
    "src/evaluatorq/dashboard/library.py" = ["BLE001"]
    "src/evaluatorq/dashboard/redteam_views.py" = ["BLE001"]
    "src/evaluatorq/dashboard/report_tabs.py" = ["BLE001"]
    "src/evaluatorq/dashboard/sim_compare.py" = ["BLE001"]
    "src/evaluatorq/dashboard/sim_views.py" = ["BLE001"]
    "src/evaluatorq/fetch_data.py" = ["BLE001"]
    "src/evaluatorq/integrations/callable_integration/target.py" = ["BLE001"]
    "src/evaluatorq/integrations/langgraph_integration/target.py" = ["BLE001"]
    "src/evaluatorq/integrations/pydantic_ai_integration/target.py" = ["BLE001"]
    "src/evaluatorq/openresponses/tracing.py" = ["BLE001"]
    "src/evaluatorq/processings.py" = ["BLE001"]
    "src/evaluatorq/redteam/cli.py" = ["BLE001"]
    "src/evaluatorq/redteam/reports/recommendations.py" = ["BLE001"]
    "src/evaluatorq/redteam/runner.py" = ["BLE001"]
    "src/evaluatorq/redteam/runtime/jobs.py" = ["BLE001"]
    "src/evaluatorq/redteam/ui/dashboard.py" = ["BLE001"]
    "src/evaluatorq/simulation/cli.py" = ["BLE001"]
    "src/evaluatorq/simulation/generators/persona_generator.py" = ["BLE001"]
    "src/evaluatorq/simulation/generators/scenario_generator.py" = ["BLE001"]
    "src/evaluatorq/simulation/reports/recommendations.py" = ["BLE001"]
    "src/evaluatorq/simulation/runner/simulation.py" = ["BLE001"]
    "src/evaluatorq/simulation/traces.py" = ["BLE001"]
    "src/evaluatorq/simulation/utils/run_store.py" = ["BLE001"]
    "src/evaluatorq/tracing/setup.py" = ["BLE001"]

    # Keep competing stacks out. Call-site rules (which module may build a client or
    # call the API) live in tests/test_reuse_guardrails.py — banning the imports here
    # would also hit the ~36 modules that import AsyncOpenAI purely for typing.
    [tool.ruff.lint.flake8-tidy-imports.banned-api]
    "tenacity".msg = "Use evaluatorq.common.retry.with_retry, or the SDK's own max_retries — one retry layer, not two."
    "backoff".msg = "Use evaluatorq.common.retry.with_retry."
    "requests".msg = "Use httpx (already a runtime dependency); async paths need it anyway."

[tool.basedpyright]
pythonVersion = "3.10"
exclude = [ "examples", "scripts", ".venv", "src/evaluatorq/redteam/ui", "src/evaluatorq/simulation/ui" ]
reportIncompatibleVariableOverride = "none"
reportExplicitAny = "none"
reportMissingImports = "none"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportUnusedCallResult = "none"
reportUnannotatedClassAttribute = "none"
reportPrivateUsage = "none"
reportPrivateLocalImportUsage = "none"
reportImplicitStringConcatenation = "none"
reportUnusedImport = "none"
reportDeprecated = "none"
reportUnusedVariable = "none"
reportMissingParameterType = "none"
reportUnusedParameter = "none"
reportUnreachable = "none"
reportUnsupportedDunderAll = "none"
reportImportCycles = "none"
reportImplicitOverride = "none"
reportUnusedFunction = "none"
reportUntypedFunctionDecorator = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "none"

# FastHTML's dynamic FT components (Script, Div, NotStr, etc.) and starlette
# request injection type poorly. Scope the resulting noise to the dashboard
# package so typecheck CI stays green without loosening the global config.
[[tool.basedpyright.executionEnvironments]]
root = "src/evaluatorq/dashboard"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportMissingTypeArgument = "none"
reportReturnType = "none"

# Dashboard tests use FastHTML components and deliberate fake section kinds /
# untyped fixture dicts — same type-noise as the package, scoped the same way.
[[tool.basedpyright.executionEnvironments]]
root = "tests/dashboard"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportMissingTypeArgument = "none"
reportReturnType = "none"

[project]
name = "evaluatorq"
dynamic = ["version"]
description = "An evaluation framework library for Python that provides a flexible way to run parallel evaluations and optionally integrate with the Orq AI platform."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.28.1",
  "rich>=14.2.0",
  "loguru>=0.6.0",
  "typer>=0.12.0",
  "openai>=1.92.0,<4.0.0",
  "orq-ai-sdk>=4.12",
]

  [project.license]
  text = "MIT"

  [project.optional-dependencies]
  orq = [ "orq-ai-sdk>=4.12" ]
  otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0",
  "opentelemetry-semantic-conventions>=0.41b0"
]
  langchain = [ "langchain>=1.0.0, <2.0.0" ]
  langgraph = [ "langgraph>=0.2.0" ]
  openai-agents = [ "openai-agents>=0.1.0" ]
  pydantic-ai = [ "pydantic-ai-slim[openai]>=1.0.0" ]
  crewai = [ "crewai>=0.70.0; python_version >= '3.11'" ]
  redteam = [
  "huggingface-hub>=0.20.0",
  "streamlit>=1.30.0",
  "plotly>=5.18.0",
  "watchdog>=4.0.0",
  "vl-convert-python>=1.6.0"
]
  simulation = [
  "orq-ai-sdk>=4.12",
  "streamlit>=1.30.0",
  "plotly>=5.18.0",
  "watchdog>=4.0.0",
  "vl-convert-python>=1.6.0"
]
  dashboard = [
  "python-fasthtml>=0.12.0,<0.15.0",
  "uvicorn>=0.30.0",
  "vl-convert-python>=1.6.0"
]
  all = [
  "evaluatorq[orq,otel,langchain,langgraph,openai-agents,pydantic-ai,crewai,redteam,simulation,dashboard]"
]

  [project.scripts]
  evaluatorq = "evaluatorq.cli:main"
  eq = "evaluatorq.cli:main"

  [project.urls]
  Homepage = "https://github.com/orq-ai/evaluatorq"
  Repository = "https://github.com/orq-ai/evaluatorq"
  Documentation = "https://orq-ai.github.io/evaluatorq/"

# python-semantic-release is used ONLY as a version calculator here
# (`semantic-release version --print` in CI). It reads the base version from the
# latest git tag and derives the next from conventional commits. It does NOT
# write files, commit, tag, or push — the release workflow tags + pushes itself.
# No version_toml (version is tag-driven via hatch-vcs), no commit/remote config.
[tool.semantic_release]
branch = "main"
commit_parser = "conventional"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[dependency-groups]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material[imaging]>=9.5.0",
  "mkdocstrings[python]>=0.26.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.0",
  "mkdocs-section-index>=0.3.0",
  "termynal>=0.12.0",
  "mkdocs-redirects>=1.2.0",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2.9",
  "mkdocs-htmlproofer-plugin>=1.2.0",
  "mkdocs-llmstxt>=0.5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.2.0",
  "pytest-timeout>=2.3.0",
  "basedpyright>=1.21.0",
  "ruff>=0.14.3",
  "orq-ai-sdk>=4.12",
  "anthropic>=0.75.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.2.0",
  "typer>=0.12.0",
  "pytest-cov>=7.0.0",
  "watchdog>=4.0.0",
  "openai-agents>=0.1.0",
  "vl-convert-python>=1.6.0"
]
