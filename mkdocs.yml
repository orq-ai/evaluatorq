site_name: evaluatorq
site_description: Run LLM evaluations, red-team agents, and simulate multi-turn conversations in Python.
site_url: https://orq-ai.github.io/evaluatorq/
repo_url: https://github.com/orq-ai/evaluatorq
repo_name: orq-ai/evaluatorq
docs_dir: docs
copyright: "© 2026 Orq AI · MIT License"

# Keep skill scratch (plans/specs) out of build.
exclude_docs: |
  superpowers/

theme:
  name: material
  custom_dir: overrides   # overrides/main.html adds the <link rel=alternate> to /llms.txt (RES-1037)
  logo: assets/orq-mark-white.svg
  favicon: assets/orq-favicon.svg
  # Self-host the Orq brand fonts (Avio Sans / Kurrent) — see stylesheets/extra.css.
  # `false` stops Material fetching Google Fonts; @font-face + var overrides do the rest.
  font: false
  # Feature set mirrors Pydantic's docs (Material for MkDocs), minus the
  # Insiders-only ones (navigation.path, instant.prefetch/preview, tabs.sticky)
  # that would fail `mkdocs build --strict` on the community edition.
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  # 3-way auto / light / dark toggle (same UX as Pydantic), Orq palette.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch light mode }

extra_css:
  - stylesheets/extra.css

# Build hooks. hooks.py enforces llms.txt <-> nav parity (see the llmstxt plugin note).
hooks:
  - docs/hooks.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  # Animated terminal blocks (Typer/FastAPI style). Mark a fence with
  # `<!-- termynal -->` to type it out with a cursor + fake progress.
  - termynal:
      prompt_literal_start:
        - "$"
        - ">>>"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            members_order: source
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
  # Agent-browsable docs (RES-1037): generate /llms.txt (a curated markdown index)
  # and /llms-full.txt (all docs as one markdown file) per the llms.txt convention, so
  # coding agents read the docs as markdown instead of scraping HTML. Must sit AFTER
  # mkdocstrings in the plugin list: both hook `on_page_content`, and plugins run in
  # declaration order, so this captures the API pages only once mkdocstrings has rendered
  # them (declaration-order, not a build-phase dependency).
  #
  # `sections` restates the pages in `nav:`. docs/hooks.py enforces parity at build time
  # (every nav doc must be covered here, or `mkdocs build --strict` fails), so this can't
  # silently drift out of sync with nav again.
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md: Overview, why evaluatorq, and installation.
          - guides/getting-started.md: Run your first evaluation end to end.
        Guides:
          - guides/agent-simulation.md: Multi-turn, persona-driven conversation testing with an LLM judge.
          - guides/red-teaming.md: Adaptive OWASP-mapped adversarial security testing for agents.
          - custom-evaluators-and-frameworks.md: Define custom evaluators and frameworks.
          - llm-as-a-jury.md: Multi-judge panel (jury) evaluation.
          - pairwise-judging.md: Pairwise comparison judging.
          - dashboard.md: The interactive results dashboard.
        Setup:
          - configuration.md: Configuration and environment variables.
          - tracing.md: OpenTelemetry tracing.
          - cli-reference.md: CLI commands (evaluatorq / eq).
          - orq-deployment.md: Running against Orq deployments.
        API reference:
          # NOTE: the plugin markdownifies rendered HTML, which flattens mkdocstrings'
          # param-type column. The API index/links are still useful to an agent; the
          # authoritative typed signatures live in the served HTML. A docstring-sourced
          # dump is a follow-up (RES-1037 review #4).
          - reference/evaluatorq.md: The evaluatorq package API surface.
          - reference/evaluatorq/*.md
        Examples:
          # `**/` is load-bearing under the plugin's fnmatch: it requires a subdirectory, so this
          # matches example CONTENT at any depth (examples/<group>/<page>.md) but excludes the
          # top-level scaffolding (examples/index.md, examples/SUMMARY.md). `examples/*.md` would
          # wrongly pull those in, since fnmatch `*` also spans `/`.
          - examples/**/*.md
        About:
          - contributing.md: How to contribute.
          - changelog.md: Release notes.
          - roadmap.md: Planned work.
  - redirects:
      redirect_maps:
        guides/agent-simulation-openai.md: guides/agent-simulation.md
        guides/red-teaming-openai.md: guides/red-teaming.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - minify:
      minify_html: true
      cache_safe: true
  # Social/SEO cards (og:/twitter: previews). Needs Cairo + the material[imaging]
  # extra, so gate to CI (CI=true) to keep `mkdocs serve` working without the
  # system libs locally. CI installs the deps in .github/workflows/docs.yml.
  - social:
      enabled: !ENV [CI, false]
  # Broken-link check. Strict build catches missing nav files; this catches
  # broken inline links and #anchors across the built site. External URLs are
  # skipped to keep CI deterministic (no network flakiness).
  - htmlproofer:
      validate_external_urls: false
      raise_error: true
      # Two anchors in the autogenerated API reference resolve to a module page
      # without the right fragment — an mkdocstrings quirk for re-exported names
      # (canonical anchor lives in the defining module). Everything else hard-fails.
      raise_error_excludes:
        404:
          - "../#evaluatorq.EvaluationResultCell"
          - "../simulation/#evaluatorq.simulation.AgentTarget"

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# nav GROWS PER TASK. Each task appends pages it creates to keep a
# green `mkdocs build --strict`. Never list a page before the task creates it
# (mkdocs --strict fails on a nav entry whose file is missing). Task 1 ships
# Home only; final nav shape recorded under "Target nav" in the File Structure.
nav:
  - Home: index.md
  - Get Started:
      - Getting Started: guides/getting-started.md
      - Agent Simulation: guides/agent-simulation.md
      - Red Teaming:
          - guides/red-teaming.md
          - Custom Evaluators & Frameworks: custom-evaluators-and-frameworks.md
      - LLM as a Jury: llm-as-a-jury.md
      - Pairwise Judging: pairwise-judging.md
      - Dashboard: dashboard.md
  - Reference:
      - Configuration: configuration.md
      - Tracing: tracing.md
      - CLI Reference: cli-reference.md
      - Orq Deployment: orq-deployment.md
  - Examples: examples/
  - API Reference: reference/
  - About:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Roadmap: roadmap.md
