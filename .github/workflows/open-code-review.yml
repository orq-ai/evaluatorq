# Sole AI reviewer for PRs. Copied from orq-ai/research, where it replaced the
# Claude PR reviewer.
# Requires repo secret ORQ_REVIEW_API_KEY: an orq gateway key with router access,
# scoped to the evaluatorq-cicd project. It is this workflow's alone — ORQ_API_KEY
# is a separate key for examples-weekly.yml and jury-rates-monthly.yml, so a
# rotation on either side cannot take the other down.

name: OpenCodeReview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open-code-review:
    # A dependabot-triggered run reads the Dependabot secret store, where
    # ORQ_REVIEW_API_KEY does not exist.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fork of alibaba/open-code-review, based on upstream main at
      # 6e5cd8cf2578768b6c6d1fafa1d14f66801d5f2b (after v1.11.1); the fork diff
      # is four commits, `git log 6e5cd8c..560e68a`. Upstream caps code_search
      # by match count, never by size, so one match in a generated report — one in
      # orq-ai/research is a 10.7 MB single line — filled the whole context window
      # and the review stopped on "context compression exceeded its threshold". The fork
      # bounds a single tool result and spills the rest to a handle the model can
      # page through. The fourth commit adds the llm_protocol input: the CLI
      # has spoken the OpenAI Responses API for a while, but the action only
      # exposed the two-way llm_use_anthropic toggle, so the protocol below was
      # unreachable from a workflow. Both are to be upstreamed; drop the fork
      # once they land.
      #
      # The SHA below is also tagged v1.12.1+orq.2 in the fork, so it stays
      # reachable if the feat/ branch is rebased away. Pin stays on the SHA: a
      # tag can be moved, a SHA cannot.
      - uses: orq-ai/open-code-review@560e68aa9a8c64f343fabcd2afff7b8333644856 # v1.12.1+orq.2
        with:
          # The Responses API, which is what the OpenAI model below is built
          # for: the CLI appends /responses to this URL, giving the same
          # /v3/router/responses endpoint evaluatorq's own openresponses client
          # talks to. Reasoning comes back as native reasoning items that the
          # protocol carries across tool turns — chat completions drops
          # reasoning between turns, and OCR reviews are a multi-turn tool loop.
          #
          # api.orq.ai is the documented front door for the v3 gateway: it is
          # the host `orq launch` exports to the CLIs it wraps. my.orq.ai/v3
          # serves the same gateway and is what research's first runs used, but
          # there is no reason to route CI through the less documented host.
          llm_url: https://api.orq.ai/v3/router
          llm_auth_token: ${{ secrets.ORQ_REVIEW_API_KEY }}
          # openai/gpt-5.6-luna, the same model as DEFAULT_PIPELINE_MODEL.
          # Check gen_ai.response.model on a trace to confirm what the gateway
          # actually served.
          llm_model: openai/gpt-5.6-luna
          # Without this, every synchronize push re-reviews merge-base..head and
          # re-posts findings it already made — PR #214 collected the same comment
          # three times. true appends only comments whose (path, line range) does
          # not overlap one the bot already left; it deletes nothing.
          incremental: 'true'
          # The next run reviews <last reviewed head>..<new head> rather than
          # <merge-base>..<new head>, so a re-push is not re-reviewed at all.
          # Fail-closed: a missing or unreadable checkpoint, a moved base or a
          # config change all fall back to the full range. Relies on
          # sticky_summary, which defaults to true. Set full_review: 'true' for
          # one deliberate re-review from the merge-base.
          checkpoint_range: 'true'
          # llm_use_anthropic is still required by the action, but llm_protocol
          # wins over it and the action keeps the two in sync — the toggle is
          # two-way and cannot name the Responses API on its own.
          llm_use_anthropic: 'false'
          llm_protocol: 'openai-responses'
          # Pinned rather than left empty, which would resolve to medium: the
          # cost dial should be visible in the file, not inherited. At medium on
          # the previous model one 90-line diff cost 924,609 tokens (216,641 of
          # them not cache reads) in 9m33s; high costs more. Drop it if too dear.
          # Note llm_reasoning_effort is a different dial and must stay unset —
          # it sends a top-level reasoning_effort, which is Chat Completions
          # vocabulary that the Responses API rejects, so the action fails fast
          # when it is set here. The Responses-side equivalent is the reasoning
          # effort in llm_extra_body below.
          effort: 'high'
          # Required, not cosmetic: the action's default extra_body is
          # {"thinking": {"type": "disabled"}}, an Anthropic-shaped field the
          # Responses API would reject. Reasoning effort rides this body as
          # reasoning.effort, the field the Responses API actually takes.
          #
          # fallbacks is the gateway's own failover chain, tried in order when
          # the model above answers 429/500/502/503/504 — a 4xx that is not a
          # rate limit (400, 401, 403) is not retried against anyone, so a bad
          # request stays a bad request. One reviewer-tier model per provider,
          # so an outage at one provider does not take the review with it.
          # Nothing here fails over on a slow or bad review, only on a dead
          # endpoint. Keep the chain at three: that is the documented ceiling.
          llm_extra_body: >-
            {"reasoning": {"effort": "high"},
             "fallbacks": [{"model": "deepseek/deepseek-flash"},
                           {"model": "anthropic/claude-haiku-4-5-20251001"}]}
          # No ocr_version: the fork builds the CLI from its own checkout with
          # `go build ./cmd/opencodereview` and never installs the npm package,
          # so there is nothing left to pin and nothing floats to latest. Build
          # step: https://github.com/orq-ai/open-code-review/blob/560e68aa9a8c64f343fabcd2afff7b8333644856/action.yml#L486-L494
          # Router is billed per token; over budget the action publishes partial results and exits 0.
          max_tokens_budget: '500000'
