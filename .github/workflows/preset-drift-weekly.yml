name: Jury preset drift (weekly)

# Jury presets and router pools are priced and ranked from the live /v2/models
# garden, so nothing in the repo goes stale on a timer. What can drift is the
# choice: a seat retires, loses its score, gets a newer model in its lineage, or
# stops being on the frontier. This suite catches that against the live garden.
# Weekly and non-blocking, like examples-weekly.yml. A failure leaves the run red;
# it opens no issue.
#
# Needs repo secret ORQ_WORKSPACE_API_KEY: a workspace-scoped orq key. A
# project-scoped key sees a truncated garden, so the suite's scope check fails on
# purpose and missing models read as retired. Falls back to ORQ_API_KEY so the
# workflow still runs (and reports that failure) before the secret exists.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset-drift:
    name: Preset freshness and pool derivation (live garden)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Run live preset checks
        env:
          ORQ_API_KEY: ${{ secrets.ORQ_WORKSPACE_API_KEY || secrets.ORQ_API_KEY }}
        run: uv run pytest -m integration tests/integration/test_preset_freshness.py tests/unit/test_router_pools.py

