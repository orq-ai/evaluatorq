name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Ruff lint
        run: uv run ruff check src

      - name: Ruff format check
        run: uv run ruff format --check src

  check:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the 3.13 leg publishes coverage (see the two conditional steps below).
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # Canonical dev version is 3.13; test backwards compat down to the
        # minimum supported (requires-python = ">=3.10").
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Typecheck (basedpyright)
        run: uv run basedpyright

      - name: Test (unit only)
        if: matrix.python-version != '3.13'
        run: uv run pytest -m 'not integration'

      # Coverage instrumentation costs wall-clock, so only the canonical leg pays
      # for it. The other legs run the same suite bare, above.
      - name: Test (unit only, with coverage)
        if: matrix.python-version == '3.13'
        run: uv run pytest -m 'not integration' --cov --cov-report=term

      # Posts a coverage comment on PRs and, on push to main, writes badge +
      # report data to the `python-coverage-comment-action-data` branch. Uses the
      # built-in GITHUB_TOKEN — no secret to configure. Fork PRs get a read-only
      # token, so the comment is skipped there; the badge still updates on main.
      - name: Coverage badge + PR comment
        if: matrix.python-version == '3.13'
        uses: py-cov-action/python-coverage-comment-action@v3
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}

  examples:
    name: Examples (static)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      # Parses examples and notebooks, resolves every evaluatorq import against
      # the installed package. No execution, no credentials, no API spend —
      # several examples call an LLM at module level, so importing them is not
      # free. Runtime breakage is covered by examples-weekly.yml.
      - name: Check example imports
        run: uv run python scripts/check_examples.py

  resolve-sdk-matrix:
    name: Resolve SDK matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve SDK versions
        id: resolve
        run: |
          versions="$(python scripts/sdk_matrix.py)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  sdk-compat:
    name: SDK compatibility
    needs: resolve-sdk-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJson(needs.resolve-sdk-matrix.outputs.versions) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Install SDK version
        run: uv pip install "orq-ai-sdk==${{ matrix.sdk }}"

      - name: Test SDK compatibility
        run: uv run --no-sync pytest tests/redteam/test_orq_backend_context.py tests/redteam/test_contracts.py
