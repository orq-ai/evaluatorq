name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Dependabot runs read the Dependabot secret store, where CLAUDE_CODE_OAUTH_TOKEN
    # does not exist, and the action refuses bot actors anyway.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and give feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Then run the docs check below. Use the repository's CLAUDE.md for style
            and conventions. Be constructive and specific.

            ## Docs check

            This repo's rule is that docs ship in the same PR as the feature. Check the
            code this PR changed or added, not the repo as a whole.

            First read `.claude/skills/docs-coverage/axes.md`. It defines the axes users
            choose between — entry point, surface, target kind, mode, data source,
            evaluator kind — and the combinations that are impossible.

            Then, for the diff only:

            1. **New axis values.** Does the diff add a value on any of those axes — a new
               mode, backend, target kind, entry point, CLI command, evaluator kind? Name
               each one.
            2. **Usage paths it opens.** For each new value, what combinations
               can a user now reach that they could not before? Check whether any hand-written
               page explains one of them. A generated API page under `reference/` does not
               count; neither does a passing mention without a runnable example.
            3. **Changed surface.** `__all__`, CLI flags, defaults, env vars, enum or
               registry members that the diff altered — does the page documenting each one
               still say something true?
            4. **A new axis entirely.** If the diff adds a dimension `axes.md` does not
               list, that file must be edited in this PR or coverage checking silently
               stops seeing it. Say so explicitly.

            If the diff opens no new usage path and changes no documented surface, say
            "no docs impact" in one line and skip the rest. Most PRs land here — do not
            manufacture a docs finding to have something to say.

            Report each gap as one line: the usage path the diff opened, and the page you
            would expect to explain it. Advisory only — it never blocks the merge, and the
            weekly docs-autofill routine backfills what slips through. Say that, so nobody
            reads a finding as a merge blocker.

            Leave the whole review as a single PR comment with `gh pr comment`.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Glob,Grep"'
