<svg viewBox="0 0 960 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="insights-flow-title insights-flow-desc">
  <title id="insights-flow-title">How one Trace Insights run moves from population to saved result</title>
  <desc id="insights-flow-desc">Flow diagram in three phases. First the population is selected from Orq filters, a semantic query, a Finder export or a local snapshot; a query is compiled only when one is set, and every trace is loaded and normalized as a TraceDocument. Then each trace is read: deterministic signals are computed locally and kept out of model prompts, the classifier answers labels and the query match, only query matches continue (all traces when there is no query), and the retained traces are summarized from the detailed conversation view. Finally, for each dimension the summaries are embedded, clustered, named, merged and projected, an optional priority matrix is built, and the run is saved to .evaluatorq/insights-runs/ for the dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
    <style>
      .sans { font-family: 'Avio Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Kurrent Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { font-size: 12px; font-weight: 600; fill: #25232e; }
      .sub { font-size: 9px; fill: #025558; }
      .tag { font-size: 7px; letter-spacing: 0.08em; }
      .phase { font-size: 8px; letter-spacing: 0.18em; fill: #025558; }
      .edge { font-size: 8px; letter-spacing: 0.06em; fill: #025558; }
      .note { font-size: 13px; font-style: italic; fill: #25232e; }
      .legend { font-size: 8px; fill: #025558; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="611" rx="12" fill="#f9f8f6" stroke="rgba(37,35,46,0.10)"/>

  <!-- ============ Connectors (drawn first, nodes sit on top) ============ -->
  <line x1="296" y1="104" x2="350" y2="104" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="608" y1="104" x2="662" y2="104" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- wrap A -> B -->
  <path d="M 792,144 V 172 H 20 V 248 H 38" fill="none" stroke="#025558" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <line x1="236" y1="248" x2="266" y2="248" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="464" y1="248" x2="494" y2="248" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="692" y1="248" x2="722" y2="248" stroke="#df5325" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- wrap B -> C -->
  <path d="M 822,288 V 372 H 20 V 468 H 38" fill="none" stroke="#025558" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <line x1="560" y1="468" x2="590" y2="468" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="728" y1="468" x2="758" y2="468" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Edge labels (masked) -->
  <rect x="408" y="160" width="128" height="12" rx="2" fill="#f9f8f6"/>
  <text class="mono edge" x="472" y="169" text-anchor="middle">ONE DOCUMENT PER TRACE</text>
  <rect x="384" y="360" width="176" height="12" rx="2" fill="#f9f8f6"/>
  <text class="mono edge" x="472" y="369" text-anchor="middle">ONE SUMMARY PER KEPT TRACE</text>

  <!-- ============ Phase 01: select the population ============ -->
  <text class="mono phase" x="40" y="52">01 · SELECT THE POPULATION</text>

  <!-- A1 Population source (input) -->
  <rect x="40" y="64" width="256" height="80" rx="6" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
  <rect x="48" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(107,105,117,0.40)" stroke-width="0.8"/>
  <text class="mono tag" x="62" y="81" fill="#6b6975" text-anchor="middle">SRC</text>
  <text class="sans title" x="168" y="104" text-anchor="middle">Population source</text>
  <text class="mono sub" x="168" y="120" text-anchor="middle">Orq filters · semantic query</text>
  <text class="mono sub" x="168" y="134" text-anchor="middle">Finder export · local snapshot</text>

  <!-- A2 Compile query (model) -->
  <rect x="352" y="64" width="256" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <rect x="360" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
  <text class="mono tag" x="374" y="81" fill="#25232e" text-anchor="middle">LLM</text>
  <text class="sans title" x="480" y="104" text-anchor="middle">Compile the query</text>
  <text class="mono sub" x="480" y="120" text-anchor="middle">only when a query is set</text>
  <text class="mono sub" x="480" y="134" text-anchor="middle">selects filters when needed</text>

  <!-- A3 Load and normalize (local) -->
  <rect x="664" y="64" width="256" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <rect x="672" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="686" y="81" fill="#025558" text-anchor="middle">DOC</text>
  <text class="sans title" x="792" y="104" text-anchor="middle">Load and normalize</text>
  <text class="mono sub" x="792" y="120" text-anchor="middle">each trace as a TraceDocument</text>
  <text class="mono sub" x="792" y="134" text-anchor="middle">same shape for every source</text>

  <!-- ============ Phase 02: read each trace ============ -->
  <text class="mono phase" x="40" y="200">02 · READ EACH TRACE</text>

  <!-- B1 Signals (local) -->
  <rect x="40" y="208" width="196" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <rect x="48" y="216" width="28" height="12" rx="2" fill="none" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="62" y="225" fill="#025558" text-anchor="middle">LOC</text>
  <text class="sans title" x="138" y="248" text-anchor="middle">Compute signals</text>
  <text class="mono sub" x="138" y="264" text-anchor="middle">deterministic, local</text>
  <text class="mono sub" x="138" y="278" text-anchor="middle">no model call</text>

  <!-- B2 Classifier (model) -->
  <rect x="268" y="208" width="196" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <rect x="276" y="216" width="28" height="12" rx="2" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
  <text class="mono tag" x="290" y="225" fill="#25232e" text-anchor="middle">LLM</text>
  <text class="sans title" x="366" y="248" text-anchor="middle">Classifier</text>
  <text class="mono sub" x="366" y="264" text-anchor="middle">labels + query match</text>
  <text class="mono sub" x="366" y="278" text-anchor="middle">yes/no · choice · score</text>

  <!-- B3 Query gate (focal) -->
  <rect x="496" y="208" width="196" height="80" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
  <rect x="504" y="216" width="32" height="12" rx="2" fill="none" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="520" y="225" fill="#df5325" text-anchor="middle">GATE</text>
  <text class="sans title" x="594" y="248" text-anchor="middle">Keep query matches</text>
  <text class="mono sub" x="594" y="264" text-anchor="middle">no query: keep every trace</text>
  <text class="mono sub" x="594" y="278" text-anchor="middle">labels never filter</text>

  <!-- B4 Summarize (model) -->
  <rect x="724" y="208" width="196" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <rect x="732" y="216" width="28" height="12" rx="2" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
  <text class="mono tag" x="746" y="225" fill="#25232e" text-anchor="middle">LLM</text>
  <text class="sans title" x="822" y="248" text-anchor="middle">Summarize</text>
  <text class="mono sub" x="822" y="264" text-anchor="middle">retained traces only</text>
  <text class="mono sub" x="822" y="278" text-anchor="middle">detailed conversation view</text>

  <!-- Callouts -->
  <path d="M 138,288 V 308" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="138" cy="288" r="2" fill="#25232e"/>
  <text class="sans note" x="138" y="326" text-anchor="middle">Measured, not asked.</text>
  <text class="sans note" x="138" y="343" text-anchor="middle">Kept out of every prompt.</text>

  <path d="M 594,288 V 308" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="594" cy="288" r="2" fill="#25232e"/>
  <text class="sans note" x="594" y="326" text-anchor="middle">Only the query match decides</text>
  <text class="sans note" x="594" y="343" text-anchor="middle">which traces continue.</text>

  <!-- ============ Phase 03: discover dimensions ============ -->
  <text class="mono phase" x="40" y="400">03 · DISCOVER DIMENSIONS</text>

  <!-- C1 Per-dimension container -->
  <rect x="40" y="412" width="520" height="112" rx="6" fill="rgba(2,85,88,0.04)" stroke="#025558" stroke-width="1"/>
  <rect x="48" y="420" width="28" height="12" rx="2" fill="none" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="62" y="429" fill="#025558" text-anchor="middle">DIM</text>
  <text class="sans title" x="300" y="440" text-anchor="middle">For each dimension</text>

  <line x1="134" y1="464" x2="152" y2="464" stroke="#025558" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="238" y1="464" x2="256" y2="464" stroke="#025558" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="342" y1="464" x2="360" y2="464" stroke="#025558" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="446" y1="464" x2="464" y2="464" stroke="#025558" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="50" y="452" width="84" height="24" rx="4" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <text class="mono edge" x="92" y="467" fill="#25232e" text-anchor="middle">EMBED</text>
  <rect x="154" y="452" width="84" height="24" rx="4" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <text class="mono edge" x="196" y="467" text-anchor="middle">CLUSTER</text>
  <rect x="258" y="452" width="84" height="24" rx="4" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <text class="mono edge" x="300" y="467" fill="#25232e" text-anchor="middle">NAME</text>
  <rect x="362" y="452" width="84" height="24" rx="4" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <text class="mono edge" x="404" y="467" fill="#25232e" text-anchor="middle">MERGE</text>
  <rect x="466" y="452" width="84" height="24" rx="4" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <text class="mono edge" x="508" y="467" text-anchor="middle">PROJECT</text>

  <text class="mono sub" x="300" y="497" text-anchor="middle">intent · failure · sentiment</text>
  <text class="mono sub" x="300" y="512" text-anchor="middle">two-level clusters · 3D UMAP coordinates</text>

  <!-- C2 Priority matrix (optional) -->
  <rect x="592" y="428" width="136" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="600" y="436" width="28" height="12" rx="2" fill="none" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="614" y="445" fill="#025558" text-anchor="middle">OPT</text>
  <text class="sans title" x="660" y="468" text-anchor="middle">Priority matrix</text>
  <text class="mono sub" x="660" y="484" text-anchor="middle">optional</text>
  <text class="mono sub" x="660" y="498" text-anchor="middle">intent if selected</text>

  <!-- C3 Saved run (store) -->
  <rect x="760" y="428" width="160" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <rect x="768" y="436" width="28" height="12" rx="2" fill="none" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
  <text class="mono tag" x="782" y="445" fill="#025558" text-anchor="middle">RUN</text>
  <text class="sans title" x="840" y="468" text-anchor="middle">Saved run</text>
  <text class="mono sub" x="840" y="484" text-anchor="middle">.evaluatorq/insights-runs/</text>
  <text class="mono sub" x="840" y="498" text-anchor="middle">read by eq dashboard</text>

  <!-- ============ Legend ============ -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
  <text class="mono phase" x="40" y="570">LEGEND</text>

  <rect x="40" y="582" width="14" height="10" rx="2" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
  <text class="sans legend" x="60" y="590">Population input</text>

  <rect x="150" y="582" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
  <text class="sans legend" x="170" y="590">Local step or saved state</text>

  <rect x="290" y="582" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
  <text class="sans legend" x="310" y="590">Model call</text>

  <rect x="380" y="582" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
  <text class="sans legend" x="400" y="590">Membership gate</text>

  <rect x="490" y="582" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1" stroke-dasharray="3,2"/>
  <text class="sans legend" x="510" y="590">Optional</text>

  <line x1="570" y1="587" x2="598" y2="587" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="sans legend" x="606" y="590">Flow</text>

  <line x1="650" y1="587" x2="678" y2="587" stroke="#df5325" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text class="sans legend" x="686" y="590">Kept traces only</text>
</svg>
